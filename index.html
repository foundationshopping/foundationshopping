<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础购物网站</title>

        /* 简单好用的基础样式 */
        body {
            font-family: Arial, sans-serif;

        }

        header {
            background-color: #333;
            color: #fff;

            margin: 2rem auto;
            padding: 0 1rem;

    <header>
        <h1>基础购物网站</h1>

    <main class="container">
        <p>欢迎来到我的购物网站！</p>

    </main>
